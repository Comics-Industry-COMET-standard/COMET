name: IssueSort
label: IssueSort
position: 37
tier: core
owner: publisher
type: Decimal
required: 'no'
length: 14,2
description: |-
  The number used to put the issues of a series in order. By default it is the same as the SeriesNumber.
example: '14.5'
notes: |-
  Default: use the SeriesNumber. For an issue that falls outside the regular numbering, use a decimal value that places it between the issues it sits between. Example: if issue #0 falls between issue #14 and issue #15, its IssueSort is 14.5. Decimal places are allowed.
